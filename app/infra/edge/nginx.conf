events {}
http {
  access_log off;
  error_log /dev/stderr warn;
  resolver 127.0.0.11 valid=10s;
  types { }
  default_type application/json;
  server {
    listen 8080;
    error_page 502 504 = @unavailable;
    location = /healthz { return 200 '{"service":"edge","application":"ready"}'; }
    location /api/billing-api/ { set $backend app-billing-api:3000; rewrite ^/api/billing-api/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/redirect-service/ { set $backend app-redirect-service:3000; rewrite ^/api/redirect-service/(.*)$ /$1 break; proxy_pass http://$backend; }
    location /api/session-api/ { set $backend app-session-api:3000; rewrite ^/api/session-api/(.*)$ /$1 break; proxy_pass http://$backend; }
    location @unavailable { add_header Retry-After 1 always; return 503 '{"error":"UNAVAILABLE","message":"Service unavailable."}'; }
    location / { return 404 '{"error":"NOT_FOUND","message":"Route not found."}'; }
  }
}
