openapi: 3.1.0
info:
  title: qrwty API
  version: 1.0.0
paths:
  /auth/register:
    post:
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: &a2
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "201": &a3
          description: Signed-in identity and CSRF token
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  csrfToken:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                required:
                  - id
                  - csrfToken
                additionalProperties: false
        "400": &a1
          description: Request failed
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
        "403": *a1
        "409": *a1
        "500": *a1
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: *a2
      responses:
        "200": *a3
        "400": *a1
        "401": *a1
        "403": *a1
        "500": *a1
  /auth/session:
    get:
      operationId: readSession
      security:
        - session: []
      responses:
        "200": *a3
        "401": *a1
        "500": *a1
  /auth/logout:
    post:
      operationId: logout
      security:
        - session: []
      responses:
        "204":
          description: Session invalidated
        "401": *a1
        "403": *a1
        "500": *a1
  /api/qr:
    post:
      operationId: createQr
      security:
        - session: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: &a5
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                destination:
                  type: string
                  maxLength: 8192
                  pattern: ^[hH][tT][tT][pP][sS]?:\/\/(?![^/?#]*@)
                title:
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: "null"
              required:
                - destination
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema: &a4
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  destination:
                    type: string
                    format: uri
                  title:
                    type:
                      - string
                      - "null"
                    maxLength: 120
                required:
                  - id
                  - createdAt
                  - destination
                  - title
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "500": *a1
    get:
      operationId: listQr
      security:
        - session: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items: *a4
                  nextCursor:
                    type:
                      - string
                      - "null"
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "500": *a1
  /api/qr/{id}:
    get:
      operationId: readQr
      security:
        - session: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a4
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "500": *a1
    patch:
      operationId: updateQr
      security:
        - session: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: *a5
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: *a4
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "500": *a1
  /api/qr/{id}/image:
    get:
      operationId: downloadQr
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PNG QR code containing the stable public redirect URL
          content:
            image/png:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                  message:
                    type: string
                additionalProperties: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
        "404":
          description: QR not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
      security:
        - session: []
      x-jeeves-acceptance:
        - QR-02
        - QR-06
  /q/{id}:
    get:
      operationId: followQr
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "302":
          description: Redirect to the current destination
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
        "404":
          description: Unknown redirect
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
      security: []
      x-jeeves-acceptance:
        - QR-03
        - QR-04
        - QR-07
  /api/qr/{id}/activity:
    get:
      operationId: qrActivity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Activity over the requested UTC date range
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - days
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required:
                        - date
                        - count
                      properties:
                        date:
                          type: string
                          format: date
                        count:
                          type: integer
                          minimum: 0
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                additionalProperties: false
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
        "404":
          description: QR not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
                additionalProperties: false
      security:
        - session: []
      x-jeeves-acceptance:
        - QR-05
        - QR-06
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: jeeves_session
