nd">retailer price</text><circle cx="437.0402179565127" cy="178.0909090909091" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="451.0402179565127" y="182.0909090909091" font-size="12" fill="#52514e">$60</text><text x="278" y="206.72727272727275" font-size="12.5" fill="#0b0b0b" text-anchor="end">Brother PT-P710BT</text><text x="278" y="220.72727272727275" font-size="11" fill="#6b6a66" text-anchor="end">retailer price</text><circle cx="490.4233603403179" cy="207.72727272727275" r="7" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="504.4233603403179" y="211.72727272727275" font-size="12" fill="#52514e">$114.99</text><text x="278" y="236.36363636363637" font-size="12.5" fill="#0b0b0b" text-anchor="end">Custom Pi-based device, unit cost</text><text x="278" y="250.36363636363637" font-size="11" fill="#6b6a66" text-anchor="end">assumption</text><line x1="493.9231390493685" y1="237.36363636363637" x2="569.1182705612755" y2="237.36363636363637" stroke="#eb6834" stroke-width="10" stroke-linecap="round"/><circle cx="493.9231390493685" cy="237.36363636363637" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/><circle cx="569.1182705612755" cy="237.36363636363637" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/><text x="583.1182705612755" y="241.36363636363637" font-size="12" fill="#52514e">$120 to $300</text><text x="278" y="266" font-size="12.5" fill="#0b0b0b" text-anchor="end">Custom Pi-based device, retail</text><text x="278" y="280" font-size="11" fill="#6b6a66" text-anchor="end">derived at 40-60% margin</text><line x1="535.8438947904745" y1="267" x2="626.0011916541313" y2="267" stroke="#eb6834" stroke-width="10" stroke-linecap="round"/><circle cx="535.8438947904745" cy="267" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/><circle cx="626.0011916541313" cy="267" r="7" fill="#eb6834" stroke="#fff" stroke-width="2"/><text x="640.0011916541313" y="271" font-size="12" fill="#52514e">$200 to $600</text><text x="278" y="295.6363636363636" font-siz