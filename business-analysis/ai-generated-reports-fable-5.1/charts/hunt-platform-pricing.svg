<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Hunt platforms charge about $1 to $10 per participant" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Hunt platforms charge about $1 to $10 per participant</title>
<rect width="960" height="540" rx="8" fill="#ffffff" stroke="#d8d7d0"/>
<text x="32" y="40" font-size="21" fill="#0b0b0b" font-weight="600">Hunt platforms charge about $1 to $10 per participant</text>
<text x="32" y="62" font-size="13.5" fill="#52514e">Derived price per participant, per event (Geocaching: per player per year; Niantic: per daily unique visit); found 2026-10-30/31</text>
<circle cx="38" cy="84" r="6" fill="#2a78d6"/><text x="54" y="88.5" font-size="12.5" fill="#52514e">USD</text><circle cx="103.8" cy="84" r="6" fill="#eb6834"/><text x="119.8" y="88.5" font-size="12.5" fill="#52514e">EUR (not converted)</text><line x1="270" y1="98" x2="270" y2="396" stroke="#e1e0d9"/><text x="270" y="414" font-size="12" fill="#6b6a66" text-anchor="middle">$0.1</text><line x1="446.66666666666663" y1="98" x2="446.66666666666663" y2="396" stroke="#e1e0d9"/><text x="446.66666666666663" y="414" font-size="12" fill="#6b6a66" text-anchor="middle">$1</text><line x1="623.3333333333333" y1="98" x2="623.3333333333333" y2="396" stroke="#e1e0d9"/><text x="623.3333333333333" y="414" font-size="12" fill="#6b6a66" text-anchor="middle">$10</text><line x1="800" y1="98" x2="800" y2="396" stroke="#e1e0d9"/><text x="800" y="414" font-size="12" fill="#6b6a66" text-anchor="middle">$100</text><line x1="270" y1="98" x2="270" y2="396" stroke="#a8a79f"/><text x="535" y="440" font-size="12.5" fill="#52514e" text-anchor="middle">Price per participant, per event unless noted (log scale; bars start at 0.1)</text><text x="258" y="123.85714285714286" font-size="12.5" fill="#0b0b0b" text-anchor="end">Geocaching Premium</text><text x="258" y="137.85714285714286" font-size="11" fill="#6b6a66" text-anchor="end">per player per year</text><path d="M270 112.85714285714286H725.6780813969222a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#2a78d6"/><text x="741.6780813969222" y="128.85714285714286" font-size="12" fill="#52514e">$39.99  per player per year</text><text x="258" y="165.57142857142856" font-size="12.5" fill="#0b0b0b" text-anchor="end">GooseChase</text><text x="258" y="179.57142857142856" font-size="11" fill="#6b6a66" text-anchor="end">Single experience, up to 10 participants</text><path d="M270 154.57142857142856H618.5622177122339a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#2a78d6"/><text x="634.5622177122339" y="170.57142857142856" font-size="12" fill="#52514e">$9.90  per participant per event</text><text x="258" y="207.28571428571428" font-size="12.5" fill="#0b0b0b" text-anchor="end">Actionbound</text><text x="258" y="221.28571428571428" font-size="11" fill="#6b6a66" text-anchor="end">50 players</text><path d="M270 196.28571428571428H591.9673204025187a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#eb6834"/><text x="607.9673204025187" y="212.28571428571428" font-size="12" fill="#52514e">EUR 7.00  per participant per event</text><text x="258" y="249" font-size="12.5" fill="#0b0b0b" text-anchor="end">Actionbound</text><text x="258" y="263" font-size="11" fill="#6b6a66" text-anchor="end">100 players</text><path d="M270 238H580.1400542344437a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#eb6834"/><text x="596.1400542344437" y="254" font-size="12" fill="#52514e">EUR 6.00  per participant per event</text><text x="258" y="290.7142857142857" font-size="12.5" fill="#0b0b0b" text-anchor="end">Actionbound</text><text x="258" y="304.7142857142857" font-size="11" fill="#6b6a66" text-anchor="end">200 players</text><path d="M270 279.7142857142857H558.0675441003107a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#eb6834"/><text x="574.0675441003107" y="295.7142857142857" font-size="12" fill="#52514e">EUR 4.50  per participant per event</text><text x="258" y="332.42857142857144" font-size="12.5" fill="#0b0b0b" text-anchor="end">Actionbound</text><text x="258" y="346.42857142857144" font-size="11" fill="#6b6a66" text-anchor="end">500 players</text><path d="M270 321.42857142857144H434.5828433342807a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#eb6834"/><text x="450.5828433342807" y="337.42857142857144" font-size="12" fill="#52514e">EUR 0.90  per participant per event (at 2,500)</text><text x="258" y="374.14285714285717" font-size="12.5" fill="#0b0b0b" text-anchor="end">Niantic sponsored location</text><text x="258" y="388.14285714285717" font-size="11" fill="#6b6a66" text-anchor="end">per daily unique visit (secondary)</text><path d="M270 363.14285714285717H389.48470076602996a4 4 0 0 1 4 4v16a4 4 0 0 1 -4 4H270z" fill="#2a78d6" fill-opacity="0.45"/><text x="405.48470076602996" y="379.14285714285717" font-size="12" fill="#52514e">&lt; $0.50  per daily unique visit</text><text x="32" y="476" font-size="11.5" fill="#52514e">Not plotted (no per-participant price derivable): Loquiz EUR 9 per team per month, or EUR 600 a year + EUR 5 per team;</text><text x="32" y="493" font-size="11.5" fill="#52514e">Scavify packages $995 / $1,995 (aggregator).</text>
<text x="32" y="524" font-size="11" fill="#6b6a66">Source: vendor pricing pages, one aggregator, one secondary (see data/hunt-platform-pricing.csv). Actionbound tiers are volume prices; Niantic is an upper bound.</text>
</svg>
