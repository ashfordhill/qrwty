ities</text><line x1="32" y1="438" x2="928" y2="438" stroke="#e1e0d9"/><text x="40" y="406" font-size="12" fill="#0b0b0b" font-weight="600">Upfront capital ($)</text><rect x="234" y="390" width="228" height="46" rx="3" fill="#cde2fb"/><text x="240" y="406" font-size="11.5" fill="#0b0b0b">~6/mo server (€5.49)</text><rect x="466" y="390" width="228" height="46" rx="3" fill="#cde2fb"/><text x="472" y="406" font-size="11.5" fill="#0b0b0b">~6/mo server</text><rect x="698" y="390" width="228" height="46" rx="3" fill="#cde2fb"/><text x="704" y="406" font-size="11.5" fill="#0b0b0b">800-30,000 certification +</text><text x="704" y="420" font-size="11.5" fill="#0b0b0b">inventory</text><circle cx="38" cy="90" r="6" fill="#cde2fb"/><text x="54" y="94.5" font-size="12.5" fill="#52514e">Cell holds a sourced or derived number</text><circle cx="334.79999999999995" cy="90" r="6" fill="#f4f3ef"/><text x="350.79999999999995" y="94.5" font-size="12.5" fill="#52514e">No number, or no evidence found</text>
