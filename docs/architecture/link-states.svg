</defs>
<ellipse cx="105" cy="295" rx="85" ry="45" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
<text x="105" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e1e1e">guest create</text>
<text x="105" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e">POST /links (Q06)</text>
<rect x="330" y="230" width="280" height="130" rx="18" fill="#d3f9d8" stroke="#1e1e1e" stroke-width="2"/>
<text x="470" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e1e1e">active</text>
<text x="470" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e">Redirect: 302 after the durable click</text>
<rect x="880" y="230" width="280" height="130" rx="18" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/>
<text x="1020" y="291" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e1e1e">disabled</text>
<text x="1020" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e">Redirect: 410</text>
<rect x="330" y="620" width="280" height="130" rx="18" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="470" y="681" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e1e1e">blocked</text>
<text x="470" y="709" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e">Redirect: 403 safety page</text>
<rect x="880" y="620" width="280" height="130" rx="18" fill="#495057" stroke="#1e1e1e" stroke-width="2"/>
<text x="1020" y="681" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">deleted (tombstone)</text>
<text x="1020" y="709" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">Redirect: 410; terminal</text>
<line x1="190" y1="295" x2="330" y2="295" stroke="#495057" stroke-width="2.5" marker-end="url(#m495057)"/>
<text x="198" y="263" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057">v1, unowned,</text>
<text x="198" y="282" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057">claim proof 24 h</text>
<line x1="610" y1="262" x2="880" y2="262" stroke="#1971c2" stroke-width="2.5" marker-end="url(#m1971c2)"/>
<text x="632" y="233" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">owner disables, or the</text>
<text x="632" y="252" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">account is deleted (owner removed)</text>
<line x1="880" y1="328" x2="610" y2="328" stroke="#1971c2" stroke-width="2.5" marker-end="url(#m1971c2)"/>
<text x="640" y="353" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">owner enables (owned links only)</text>
<line x1="400" y1="360" x2="400" y2="620" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#mc92a2a)"/>
<text x="222" y="460" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a">operator blocks an</text>
<text x="222" y="479" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a">active or disabled link</text>
<text x="222" y="498" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a">(actor, reason, time)</text>
<line x1="540" y1="620" x2="540" y2="360" stroke="#c92a2a" stroke-width="2.5" marker-end="url(#mc92a2a)"/>
<text x="552" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a">operator unblocks:</text>
<text x="552" y="489" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a">back to its prior state</text>
<line x1="610" y1="345" x2="880" y2="640" stroke="#1971c2" stroke-width="2.5" marker-end="url(#m1971c2)"/>
<text x="765" y="470" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">owner deletes</text>
<line x1="1060" y1="360" x2="1060" y2="620" stroke="#1971c2" stroke-width="2.5" marker-end="url(#m1971c2)"/>
<text x="1072" y="495" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">owner deletes</text>
<line x1="610" y1="705" x2="880" y2="705" stroke="#1971c2" stroke-width="2.5" marker-end="url(#m1971c2)"/>
<text x="655" y="730" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">owner deletes;</text>
<text x="655" y="749" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">the block record is kept</text>
<text xml:space="preserve" x="40" y="56" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1e1e1e" font-weight="bold">Link states — QRWTY arm A (Q06)</text>
<text xml:space="preserve" x="40" y="85" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057">One row per link in m_link_api_link_operations.links; the state, its version and a link_versions row change together in one transaction.</text>
<text xml:space="preserve" x="1200" y="158" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" font-weight="bold">Who moves a link</text>
<text xml:space="preserve" x="1200" y="187" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2">— owner (signed in, If-Match)</text>
<text xml:space="preserve" x="1200" y="211" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a">— operator (separate permission)</text>
<text xml:space="preserve" x="1200" y="235" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057">— guest create</text>
<text xml:space="preserve" x="1200" y="285" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold">Rules the database enforces</text>
<text xml:space="preserve" x="1200" y="304.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• every change: version + 1 and one</text>
<text xml:space="preserve" x="1200" y="324" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">  link_versions row, in one transaction</text>
<text xml:space="preserve" x="1200" y="343.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• a link row is never deleted; deleted</text>
<text xml:space="preserve" x="1200" y="363" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">  is terminal; the slug is never reissued</text>
<text xml:space="preserve" x="1200" y="382.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• the slug, id and domain never change</text>
<text xml:space="preserve" x="1200" y="402" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e"></text>
<text xml:space="preserve" x="1200" y="421.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold">Rules the API enforces</text>
<text xml:space="preserve" x="1200" y="441" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• a guest link is immutable until claimed</text>
<text xml:space="preserve" x="1200" y="460.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• claim (Q07): owner set, proof consumed,</text>
<text xml:space="preserve" x="1200" y="480" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">  state unchanged, version + 1</text>
<text xml:space="preserve" x="1200" y="499.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• owner enabling a blocked link:</text>
<text xml:space="preserve" x="1200" y="519" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">  409 blocked_by_operator</text>
<text xml:space="preserve" x="1200" y="538.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• stale If-Match: 412; missing: 428</text>
<text xml:space="preserve" x="1200" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e"></text>
<text xml:space="preserve" x="1200" y="577.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold">Expiry is not a state</text>
<text xml:space="preserve" x="1200" y="597" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">• after expiresAt Redirect answers 410</text>
<text xml:space="preserve" x="1200" y="616.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e">  while the state stays as it is</text>
<text xml:space="preserve" x="40" y="884" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057">Q06 implements guest create (the entry arrow). Claim, owner edits, disable, enable and delete are Q07; block and unblock are Q09; Redirect's answers are Q08.</text>
</svg>
