  qrwty-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 127.0.0.1::5432
    volumes:
      - qrwty-db-data:/var/lib/postgresql/data
    healthcheck:
